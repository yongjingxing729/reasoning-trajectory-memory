name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript)
        run: npm run prepare

      - name: Python core tests
        run: npm run test:python

      # Runs every test/*.test.mjs, including the plugin deployment smoke test
      # (mock DSH host + real Python worker + in-process PGlite/pgvector).
      - name: Node tests (indexes, built-in store, api config, plugin smoke)
        run: npm run test:node
